<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>__TOKENS__
.wrap{width:1080px;height:1350px;padding:76px 72px 64px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.badge{background:var(--cat);color:#fff;font-size:26px;font-weight:900;
  padding:10px 22px;border-radius:999px;letter-spacing:-.02em}
.brand{margin-left:auto;font-size:24px;font-weight:800;color:var(--ink-soft);letter-spacing:.02em}
h1{font-size:__H1__px;font-weight:900;line-height:1.18;letter-spacing:-.035em}
.sub{margin-top:18px;font-size:30px;font-weight:500;color:var(--ink-soft);line-height:1.45}
.rule{height:6px;background:var(--cat);width:96px;border-radius:3px;margin:32px 0 30px}
.list{display:flex;flex-direction:column;gap:__GAP__px;flex:1}
.row{display:flex;align-items:center;gap:22px;background:var(--paper-2);
  border-radius:20px;padding:__PAD__px 26px}
.n{flex:0 0 auto;width:__NW__px;height:__NW__px;border-radius:14px;background:var(--cat);
  color:#fff;font-size:__NF__px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lab{font-size:__LF__px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.val{margin-left:auto;font-size:__VF__px;font-weight:900;color:var(--cat);
  letter-spacing:-.03em;white-space:nowrap}
.foot{margin-top:26px;display:flex;align-items:flex-end;gap:20px}
.src{font-size:20px;color:var(--ink-soft);line-height:1.5;flex:1}
.cta{background:var(--ink);color:var(--paper);font-size:24px;font-weight:800;
  padding:16px 26px;border-radius:14px;white-space:nowrap}
</style></head><body class="cat-__CAT__"><div class="wrap">
  <div class="top"><div class="badge">__CAT__</div><div class="brand">@machimaza</div></div>
  <h1>__TITLE__</h1><div class="sub">__SUB__</div><div class="rule"></div>
  <div class="list">__ROWS__</div>
  <div class="foot"><div class="src">__SRC__</div><div class="cta">__CTA__</div></div>
</div></body></html>
