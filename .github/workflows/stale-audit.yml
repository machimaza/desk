name: 노후화 스캔

# 예약 실행은 **꺼 뒀습니다** (2026-08-26, 사용자 요청).
# 다시 켜려면 아래 schedule 줄의 주석(#)만 지우면 됩니다.
# 매주 월요일 09:00 KST (= 일요일 00:00 UTC)
#
# 이 워크플로는 글을 만들지 않습니다. 이미 발행한 글의 숫자가
# 원장(rates.json)과 어긋났는지 훑어보고 이슈로 알려주기만 합니다.
# 손으로 돌리는 것은 지금도 됩니다 — Actions 탭에서 '노후화 스캔' → Run workflow.
on:
  # schedule: [{ cron: '0 0 * * 0' }]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 스캔 실행
        id: scan
        run: |
          python scripts/audit_stale.py > report.md
          echo "count=$(grep -c '^| ' report.md || echo 0)" >> $GITHUB_OUTPUT

      - name: 갱신 대상이 있으면 이슈 생성
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = `콘텐츠 갱신 검토 — ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['갱신']
            });
