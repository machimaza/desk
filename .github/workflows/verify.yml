name: 검수 게이트

on:
  push:
    paths: ['content/**', 'scripts/**', '*.json', 'CLAUDE.md']
  pull_request:
    paths: ['content/**', 'scripts/**', '*.json']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 을 비교하려면 최소 2개가 필요합니다.
          # 기본값(1)이면 diff 가 항상 실패해 매번 전체를 검사하게 됩니다.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          ffmpeg -version | head -1
          fc-list :lang=ko family | head -3

      - name: 파이썬 패키지
        run: |
          set -euxo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q playwright pillow numpy markdown
          python -c "import PIL, numpy, markdown; print('py deps ok')"

      - name: 브라우저
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps chromium
          python -m playwright --version

      - name: 검사기 회귀 테스트
        # 콘텐츠보다 먼저 실행합니다.
        # 검사기가 죽은 채로 콘텐츠를 통과시키면 게이트가 있으나 마나입니다.
        run: |
          set -euxo pipefail
          python scripts/test_workflow.py
          python scripts/test_check_numbers.py
          python scripts/test_lint_terms.py
          python scripts/test_tts.py

      - name: 검사 대상 목록
        run: |
          set -euo pipefail
          # 목록은 파일로 넘깁니다.
          # 예전에는 워크플로 표현식으로 여러 줄 값을 for 목록에 직접 넣었는데,
          # 목록 안의 줄바꿈이 목록을 끝내서 bash 문법 오류(exit 2)가 났습니다.
          # 표현식 리터럴을 주석에 적는 것도 금지입니다 — 아래 2번 사고 참고.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD \
              | grep '^content/' | cut -d/ -f1,2 | sort -u > /tmp/dirs.txt || true
          else
            : > /tmp/dirs.txt
          fi
          if [ ! -s /tmp/dirs.txt ]; then
            find content -mindepth 1 -maxdepth 1 -type d ! -name '_*' | sort > /tmp/dirs.txt
          fi
          # 밑줄로 시작하는 폴더(_template · _pipeline-test)는 콘텐츠가 아닙니다.
          grep -v '/_' /tmp/dirs.txt > /tmp/dirs2.txt || true
          mv /tmp/dirs2.txt /tmp/dirs.txt
          echo "검사 대상:"
          cat /tmp/dirs.txt

      - name: 이미지 생성 후 게이트
        run: |
          set -uo pipefail
          FAIL=0
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            [ -f "$d/data.json" ] || continue
            echo "::group::$d"
            # 영상 트랙은 CLAUDE.md 10장에 따라 CI 에서 생성하지 않습니다.
            if ! python scripts/make_images.py "$d"; then
              echo "::error::이미지 생성 실패 — $d"
              FAIL=1
              echo "::endgroup::"
              continue
            fi
            python scripts/verify.py "$d" || FAIL=1
            echo "::endgroup::"
          done < /tmp/dirs.txt
          exit $FAIL

      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machimaza-outputs
          path: |
            content/*/images/
            content/*/publish/
          retention-days: 30
          if-no-files-found: warn
