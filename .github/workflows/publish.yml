name: 발행

# 손으로 실행합니다 — Actions 탭 → 발행 → Run workflow
# 기본은 미리보기입니다. 올리려면 publish 를 true 로 바꿔야 합니다.
# 게이트를 통과하지 못하면 올리는 단계까지 가지 않습니다.

on:
  workflow_dispatch:
    inputs:
      content:
        description: '콘텐츠 폴더'
        default: content/2026-08-24-건강보험-환급금
      target:
        description: '어디에'
        type: choice
        options: [threads, youtube]
        default: threads
      link:
        description: '답글에 달 블로그 주소 (비우면 답글 없음)'
        default: ''
      privacy:
        description: '유튜브 공개 범위 — 앱 검수 전에는 private 만 됩니다'
        type: choice
        options: [private, unlisted, public]
        default: private
      publish:
        description: '실제로 올릴지 — false 면 미리보기만'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CONTENT: ${{ inputs.content }}
      LINK: ${{ inputs.link }}
      DO: ${{ inputs.publish }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PRIVACY: ${{ inputs.privacy }}

    permissions:
      contents: write     # 릴리스에 영상을 올리기 위해 필요합니다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: 파이썬 패키지
        run: |
          set -euxo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 만들기
        run: |
          set -euo pipefail
          # 같은 영상이 유튜브(@machimaza)에도 가고 쓰레드(@machi_maza)에도 갑니다.
          # 워터마크는 어디로 보내느냐를 따라갑니다 — 핸들은 channels.json 이 답합니다.
          if [ "${{ inputs.target }}" = "threads" ]; then
            CH=threads
          else
            CH=youtube
          fi
          python scripts/build_voice.py "$CONTENT" \
            --voice ko-KR-HyunsuNeural --rate '+15%' --pitch '+10Hz' --engine azure
          python scripts/make_images.py "$CONTENT"
          python scripts/motion.py "$CONTENT" --channel "$CH"
          python scripts/build_publish.py "$CONTENT"

      # 이미지는 **사람이 손으로 올립니다**(네이버·티스토리는 자동화가 약관 위반).
      # 그런데 저장소에도 없고 산출물에도 없어서, 어디서도 받을 수 없었습니다.
      # 재생성은 되지만 playwright 와 한글 폰트가 필요해서 사람에게는 의미가 없습니다.
      # 여기서 만든 것을 저장소에 되돌려 놓습니다 — 이 러너에 그 환경이 이미 있습니다.
      - name: 이미지를 저장소에 되돌리기
        run: |
          set -euo pipefail
          git config user.name  "machimaza-bot"
          git config user.email "chw6236@gmail.com"
          git add -A "$CONTENT/images" "$CONTENT/thumb.png" "$CONTENT/publish" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 그림이 없습니다."
          else
            git commit -q -m "chore: $CONTENT 이미지·발행 키트 갱신 (자동)"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main
            echo "저장소에 되돌렸습니다."
          fi

      - name: 검수 게이트
        run: |
          set -euo pipefail
          echo "게이트를 통과해야 다음 단계로 갑니다."
          python scripts/verify.py "$CONTENT"

      - name: 쓰레드
        if: inputs.target == 'threads'
        run: |
          set -euo pipefail
          # set -e 에서 [ ... ] && ... 를 쓰면 조건이 거짓일 때 그 줄이
          # 실패로 잡혀 스크립트가 그대로 죽습니다. if 로 씁니다.
          ARGS=(--upload)
          if [ -n "$LINK" ]; then
            ARGS+=(--link "$LINK")
          fi
          if [ "$DO" = "true" ]; then
            ARGS+=(--publish)
          else
            echo "미리보기입니다. 올리려면 publish 를 true 로 두고 다시 실행하세요."
          fi
          python scripts/publish_threads.py "$CONTENT" "${ARGS[@]}"

      - name: 유튜브
        if: inputs.target == 'youtube'
        run: |
          set -euo pipefail
          ARGS=(--privacy "$PRIVACY")
          if [ "$DO" = "true" ]; then
            ARGS+=(--publish)
          else
            echo "미리보기입니다. 올리려면 publish 를 true 로 두고 다시 실행하세요."
          fi
          python scripts/publish_youtube.py "$CONTENT" "${ARGS[@]}"

      - name: 결과 받기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machimaza-publish
          path: |
            content/*/video.mp4
            content/*/publish/
            content/*/images/
            content/*/thumb.png
          retention-days: 14
          if-no-files-found: warn
