name: 음성·영상

# 이 컨테이너에서는 TTS 가 막혀 있어(프록시) 러너에서 만듭니다.
# 손으로 실행합니다 — Actions 탭 → 음성·영상 → Run workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '샘플 듣기(samples) 또는 영상 만들기(build)'
        type: choice
        options: [samples, build]
        default: samples
      content:
        description: '콘텐츠 폴더 (build 일 때)'
        default: content/2026-08-24-건강보험-환급금
      voice:
        description: '음성 이름 — build 와 variants 에서 씁니다'
        default: ko-KR-HyunsuNeural
      rate:
        description: '말 빠르기'
        default: '+0%'
      pitch:
        description: '목소리 높낮이'
        default: '+0Hz'
      samples:
        description: '샘플 범위 — korean 으로 목소리 고르고, variants 로 다듬습니다'
        type: choice
        options: [korean, variants, multilingual, all]
        default: korean
      grid:
        description: '다듬기 격자 — info 는 정보 전달용, child 는 아이 톤'
        type: choice
        options: [info, child]
        default: info
      engine:
        description: '음성 엔진 — azure 는 키가 있어야 합니다'
        type: choice
        options: [azure, edge]
        default: azure

jobs:
  narrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode }}
      CONTENT: ${{ inputs.content }}
      VOICE: ${{ inputs.voice }}
      RATE: ${{ inputs.rate }}
      PITCH: ${{ inputs.pitch }}
      SAMPLES: ${{ inputs.samples }}
      ENGINE: ${{ inputs.engine }}
      GRID: ${{ inputs.grid }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: 파이썬 패키지
        run: |
          set -euxo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q edge-tts playwright pillow numpy
          python -m playwright install --with-deps chromium

      - name: 한국어 음성 목록
        run: |
          set -euo pipefail
          python scripts/tts.py "$ENGINE" ko- || true
          echo "--- 한국어를 읽을 수 있는 다국어 음성 ---"
          python scripts/tts.py "$ENGINE" "" 2>/dev/null \
            | grep -i multilingual || true

      - name: 샘플 만들기
        if: inputs.mode == 'samples'
        run: |
          set -euo pipefail
          python scripts/voice_samples.py --mode "$SAMPLES" --engine "$ENGINE" \
            --voice "$VOICE" --grid "$GRID"
          ls -la samples/
          cat samples/목록.txt

      - name: 음성 + 영상 만들기
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          test -f "$CONTENT/data.json"
          python scripts/build_voice.py "$CONTENT" --voice "$VOICE" \
            --rate "$RATE" --pitch "$PITCH" --engine "$ENGINE"
          python scripts/motion.py "$CONTENT"
          python scripts/make_images.py "$CONTENT"
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$CONTENT/video.mp4"

      - name: 결과 받기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machimaza-voice
          path: |
            samples/
            content/*/video.mp4
            content/*/narration.mp3
          retention-days: 14
          if-no-files-found: warn
