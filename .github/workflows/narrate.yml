name: 음성·영상

# 이 컨테이너에서는 TTS 가 막혀 있어(프록시) 러너에서 만듭니다.
# 손으로 실행합니다 — Actions 탭 → 음성·영상 → Run workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '샘플 듣기(samples) 또는 영상 만들기(build)'
        type: choice
        options: [samples, build]
        default: samples
      content:
        description: '콘텐츠 폴더 (build 일 때)'
        default: content/2026-08-24-건강보험-환급금
      voice:
        description: '음성 이름 (build 일 때)'
        default: ko-KR-InJoonNeural
      rate:
        description: '말 빠르기'
        default: '+0%'
      pitch:
        description: '목소리 높낮이'
        default: '+0Hz'
      samples:
        description: '샘플 범위 (samples 일 때)'
        type: choice
        options: [all, korean, multilingual]
        default: all

jobs:
  narrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode }}
      CONTENT: ${{ inputs.content }}
      VOICE: ${{ inputs.voice }}
      RATE: ${{ inputs.rate }}
      PITCH: ${{ inputs.pitch }}
      SAMPLES: ${{ inputs.samples }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: 파이썬 패키지
        run: |
          set -euxo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q edge-tts playwright pillow numpy
          python -m playwright install --with-deps chromium

      - name: 한국어 음성 목록
        run: |
          set -euo pipefail
          python -m edge_tts --list-voices | grep -i '^Name: ko-' || true

      - name: 샘플 만들기
        if: inputs.mode == 'samples'
        run: |
          set -euo pipefail
          python scripts/voice_samples.py --mode "$SAMPLES"
          ls -la samples/
          cat samples/목록.txt

      - name: 음성 + 영상 만들기
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          test -f "$CONTENT/data.json"
          python scripts/build_voice.py "$CONTENT" --voice "$VOICE" --rate "$RATE" --pitch "$PITCH"
          python scripts/motion.py "$CONTENT"
          python scripts/make_images.py "$CONTENT"
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$CONTENT/video.mp4"

      - name: 결과 받기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machimaza-voice
          path: |
            samples/
            content/*/video.mp4
            content/*/narration.mp3
          retention-days: 14
          if-no-files-found: warn
